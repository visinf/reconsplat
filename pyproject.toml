[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "submodules",
    "outputs",
    "checkpoints",
    "datasets",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports/variables, undefined names, etc.
    "I",   # isort: import sorting
    "B",   # flake8-bugbear: common bug patterns
    "UP",  # pyupgrade: modernize syntax for the target Python version
]
ignore = [
    "E501",  # line too long — long tensor-shape comments/annotations are common here
    "E402",  # module-level import not at top of file — src/main.py sets os.environ before importing on purpose
    "F722",  # syntax error in forward annotation — false positive on jaxtyping shape strings, e.g. Float[Tensor, "batch view 3 h w"]
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports are expected in __init__ files that re-export symbols
