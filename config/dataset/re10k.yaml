defaults:
  - view_sampler: boundedv2

name: re10k
roots: [datasets/re10k]
make_baseline_1: true
augment: true

image_shape: [180, 320]
background_color: [0.0, 0.0, 0.0]
cameras_are_circular: false

baseline_epsilon: 1e-3
max_fov: 100.0

skip_bad_shape: true
near: -1.
far: -1.
baseline_scale_bounds: true
shuffle_val: true
test_len: -1
test_chunk_interval: 1
sort_target_index: false

train_times_per_scene: 1
test_times_per_scene: 1

# Optional {scene: scale} JSON multiplying the camera translations. Unset for the normal runs, as
# the stored VGGT poses are already normalized. Used to bring the chunks' own COLMAP poses into that
# same scale; see src/scripts/compute_colmap_pose_scales.py.
scales_path: null

labels_root: labels/re10k_depth_labels
load_depth_labels: true
load_labels_from_zarr_dirs: true
load_other_cameras: true
cameras_root: labels/re10k_vggt_cameras
camera_format: w2c # extrinsics from VGGT are in camera-from-world (or world-to-camera) format

sample_sequence_prob: 0.0
sample_sequence_stride: 1