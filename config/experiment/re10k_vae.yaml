# @package _global_

defaults:
  - override /dataset: re10k
  - override /model/encoder: costvolume
  - override /loss: [mse, lpips, kl_feature, l1, vae_lpips, vae_depth_charb, vae_depth_ssim, gan]
  - override /model/discriminator: kl_f8

wandb:
  name: re10k_vae
  tags: [re10k, 256x256]
  mode: online

data_loader:
  train:
    batch_size: 3

trainer:
  max_steps: 100_001
  val_check_interval: 500

# ----- Additional params for default best model customization
model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]
    legacy_2views: false
    grid_sample_disable_cudnn: true
    fit_ckpt: true
    gaussian_adapter:
      feature_sh_degree: 2
      n_feature_channels: 4

  discriminator:
    pretrained: true
    pretrained_path: checkpoints/pretrained/discriminator

train:
  stage: vae

# init with weights from MVSplat
checkpointing:
  pretrained_model: checkpoints/mvsplat/re10k.ckpt

loss:
  # aux. losses
  mse:
    weight: 10.0

  lpips:
    weight: 0.5
    apply_after_step: 0

  # VAE losses (recon. + perceptual + adversarial w/ adaptive weight)
  l1:
    weight: 1.0
    apply_after_step: 0

  vae_lpips:
    weight: 0.5
    apply_after_step: 0

  vae_depth_ssim:
    weight: 1.0
    apply_after_step: 0

  vae_depth_charb:
    weight: 1.0
    grad_weight: 5.0
    apply_after_step: 0

  kl_feature:
    color_weight: 1.0e-6
    depth_weight: 1.0e-6
    apply_after_step: 0

  gan:
    g_weight: 0.75
    d_weight: 1.0
    apply_after_step: 75_001

# Fixing near and far depth planes based on statistic from VGGT predictions.
dataset:
  image_shape: [256, 256]
  roots: [datasets/re10k]
  near: 0.01        # computed on RE10K with VGGT statistics
  far: 2.01         # computed on RE10K with VGGT statistics
  baseline_scale_bounds: false
  make_baseline_1: false
  sort_target_index: true
  sort_context_index: true
  test_chunk_interval: -1

  # Default view sampler as used in latentSplat - duplicated of boundedv2_re10k.yaml
  view_sampler:
    num_context_views: 2
    num_target_views: 4
    target_views_replace_sample: false
    min_distance_between_context_views: 45
    max_distance_between_context_views: 45 # 90
    max_distance_to_context_views: 45 # 90
    context_gap_warm_up_steps: 50_000   # 150_000
    target_gap_warm_up_steps: 5_000  # 50_000
    initial_min_distance_between_context_views: 25
    initial_max_distance_between_context_views: 25 # 45
    initial_max_distance_to_context_views: 5  # 0

test:
  eval_time_skip_steps: 5
  compute_scores: true
